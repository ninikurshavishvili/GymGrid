name: gym_grid
description: "GymGrid: daily gym check-ins with a photo, visualised as a year grid."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Icons drawn to match SF Symbols.
  cupertino_icons: ^1.0.8

  # State management (Cubits only) and dependency injection.
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

  # Navigation.
  go_router: ^17.5.0

  # Persistence. drift_flutter bundles SQLite and opens the database on a
  # background isolate.
  drift: ^2.34.4
  drift_flutter: ^0.3.1

  # Camera, file storage and path handling.
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  path: ^1.9.1

  # Value equality for domain entities and Cubit states.
  equatable: ^3.0.0

  # Opening Settings and web pages, and reading the app's version.
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

  # The Trends line chart, like Swift Charts. Pure Dart, so it adds no
  # native code or privacy manifest entries.
  fl_chart: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation for drift tables.
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

  # Generates Android's app icon sizes from one image.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Android's app icon in every size. The images are drawn by
# tool/app_icon/generate.swift; after changing them, run
# `dart run flutter_launcher_icons`.
#
# iOS uses a single-size icon instead, which the script writes straight into
# the asset catalog. This tool would also rewrite unrelated build settings in
# project.pbxproj (version 0.14.4 sets every ASSETCATALOG line to the icon
# name), so it's kept away from iOS.
flutter_launcher_icons:
  image_path: assets/app_icon/icon.png
  ios: false
  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/app_icon/icon_foreground.png
